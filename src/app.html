<style>
/* Inter (SIL Open Font License 1.1), served from this site: no requests to third parties. */
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/inter-400.v1.woff") format("woff")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/inter-600.v1.woff") format("woff")}
@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/inter-700.v1.woff") format("woff")}
@font-face{font-family:"Inter";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/inter-800.v1.woff") format("woff")}
@font-face{font-family:"Inter Display";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/inter-display-600.v1.woff") format("woff")}
@font-face{font-family:"Inter Display";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/inter-display-700.v1.woff") format("woff")}

/* Layout: one phone, centered on a dark field; inside it a single view swaps screens through a bill loader.
   On a real phone (or the installed app) the frame becomes the whole screen and respects the notch and home bar. */
:root{
  color-scheme: dark;
  --page:#030504;
  --bg:#070b08;
  --surface:#0d130f;
  --surface-2:#131b15;
  --raise:#1a241c;
  --line:#1f2b22;
  --line-2:#2c3b2f;
  --text:#ecf4e8;
  --muted:#8c9e8f;
  --faint:#5f7062;
  --green:#8cc63f;
  --green-hi:#b6ea6e;
  --green-ink:#0a1206;
  --cyan:#5ccfe6;
  --coral:#ff7a6b;
  --amber:#f0bd4f;
  --display:"Inter Display","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--page);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
p,h1,h2,h3{margin:0}
button,input,textarea{font:inherit;color:inherit}
button,label{-webkit-tap-highlight-color:transparent}
.btn,.tab,.srow,.chip,.check,.pcheck,.dcard,.promo,.seg button,.link-btn,.wordmark{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--green-hi);outline-offset:2px}

.stage{position:relative;height:100%;display:grid;place-items:center;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(520px 420px at 18% 12%,rgba(140,198,63,.10),transparent 70%),radial-gradient(560px 480px at 86% 88%,rgba(92,207,230,.07),transparent 70%),var(--page)}
.phone{position:relative;width:min(392px,100%);height:min(830px,100%);background:var(--bg);border-radius:48px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 1px #24322a,0 0 0 9px #0a0f0b,0 0 0 10px #1c271f,0 50px 120px -20px rgba(0,0,0,.85),0 0 90px rgba(140,198,63,.09)}
.phone::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(140,198,63,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(140,198,63,.045) 1px,transparent 1px);background-size:28px 28px;
  -webkit-mask-image:linear-gradient(to bottom,#000,transparent 42%);mask-image:linear-gradient(to bottom,#000,transparent 42%)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:98px;height:27px;border-radius:20px;background:#000;z-index:6}
.statusbar{position:relative;z-index:5;flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;padding:8px 32px 0;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.sb-icons{display:flex;gap:6px;align-items:center}
.sb-icons svg{width:17px;height:12px}

.view{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;transition:opacity .17s var(--ease),transform .17s var(--ease)}
.view::-webkit-scrollbar{display:none}
.view.leave{opacity:0;transform:translateY(-8px) scale(.99)}
.view.enter>.scr{animation:rise .36s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.scr{min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:6px 24px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:6px}

.h-xl{font-family:var(--display);font-weight:700;font-size:31px;line-height:1.08;letter-spacing:-.022em;text-wrap:balance}
.h-lg{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.12;letter-spacing:-.018em;text-wrap:balance}
.h-md{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2}
.h-sec{font-size:15px;font-weight:700;margin-bottom:-6px}
.lead{color:var(--muted);font-size:15px;max-width:34ch}
.sm{font-size:13px}
.muted{color:var(--muted)}
.fine{font-size:12.5px;color:var(--faint);display:flex;gap:6px;align-items:center;justify-content:center;text-align:center}
.fine .ic{width:15px;height:15px}
.hint{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.hint .ic{width:15px;height:15px;margin-top:2px;color:var(--faint)}
.ic{width:20px;height:20px;flex:none;display:block}

/* buttons */
.btn{appearance:none;border:0;font-weight:700;font-size:15px;min-height:52px;border-radius:16px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .15s var(--ease),background-color .2s,box-shadow .2s,color .2s}
.btn:active{transform:scale(.98)}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--green);color:var(--green-ink);box-shadow:inset 0 0 0 1px rgba(182,234,110,.45),0 12px 30px -14px rgba(140,198,63,.8)}
.btn-primary:hover{background:var(--green-hi)}
.btn-primary:disabled{background:var(--raise);color:var(--faint);box-shadow:none;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-text{background:transparent;color:var(--green);min-height:44px}
.btn-text:hover{color:var(--green-hi)}
.btn-dashed{background:transparent;color:var(--green);box-shadow:inset 0 0 0 1px rgba(140,198,63,.4);border:1px dashed transparent;min-height:50px}
.btn-dashed:hover{background:rgba(140,198,63,.06)}
.btn-danger{background:rgba(255,122,107,.1);color:var(--coral);box-shadow:inset 0 0 0 1px rgba(255,122,107,.35)}
.btn-sm{width:auto;min-height:40px;padding:0 14px;font-size:14px;border-radius:12px;flex:none}
.icon-btn{appearance:none;border:0;width:42px;height:42px;border-radius:14px;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;position:relative;flex:none;transition:background-color .2s,color .2s}
.icon-btn:hover{background:var(--raise)}
.icon-btn.accent{background:var(--green);color:var(--green-ink);box-shadow:none}
.icon-btn.accent:hover{background:var(--green-hi)}
.icon-btn.bare{width:34px;height:34px;border-radius:11px;background:transparent;box-shadow:none;color:var(--faint)}
.icon-btn.bare:hover{color:var(--coral);background:rgba(255,122,107,.08)}
.icon-btn.bare.neutral:hover{color:var(--text);background:var(--raise)}
.badge-dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--surface-2)}

/* fields */
.fields{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.add-row input,.code input,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;min-height:50px;padding:0 14px;outline:none;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
.field input:focus,.add-row input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(140,198,63,.16)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.err{color:#ffa79c;font-size:13.5px}
.err:empty{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}

.check{appearance:none;border:0;background:none;color:var(--muted);font-size:14px;display:flex;gap:12px;align-items:center;text-align:left;padding:4px 0;cursor:pointer}
.check .box{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line-2);display:grid;place-items:center;color:transparent;transition:background-color .2s,box-shadow .2s;flex:none}
.check .box .ic{width:15px;height:15px}
.check.on{color:var(--text)}
.check.on .box{background:var(--green);color:var(--green-ink);box-shadow:none}
.check.flash .box{animation:flash .6s}
@keyframes flash{30%,70%{box-shadow:inset 0 0 0 2px var(--coral),0 0 0 4px rgba(255,122,107,.2)}}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;min-height:40px;border-radius:10px;cursor:pointer;transition:background-color .2s,color .2s}
.seg button.on{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}

.amount{display:flex;align-items:baseline;gap:8px;padding:18px 20px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);transition:box-shadow .2s}
.amount input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--display);font-size:38px;font-weight:600;outline:none;padding:0;font-variant-numeric:tabular-nums}
.amount span{font-family:var(--display);font-size:22px;color:var(--muted)}
.amount:focus-within{box-shadow:inset 0 0 0 1.5px var(--green),0 0 0 4px rgba(140,198,63,.14)}

/* lists */
.list{display:flex;flex-direction:column;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 12px;border-top:1px solid var(--line)}
.row:first-child,.prow:first-child,.srow:first-child{border-top:0}
.row-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--cyan);flex:none}
.row-ic .ic{width:18px;height:18px}
.row-name{flex:1;min-width:0;border:0;background:transparent;font-weight:600;padding:6px 0;outline:none;border-bottom:1px dashed transparent}
.row-name:focus{border-bottom-color:var(--line-2)}
.row-amt{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:10px;padding:0 10px;box-shadow:inset 0 0 0 1px var(--line);width:92px;flex:none}
.row-amt input{width:100%;min-width:0;border:0;background:transparent;font-weight:700;text-align:right;min-height:36px;outline:none;font-variant-numeric:tabular-nums}
.row-amt span{color:var(--muted);font-size:13px}
.row-amt:focus-within{box-shadow:inset 0 0 0 1.5px var(--green)}
.add-row{display:flex;gap:8px;align-items:center}
.add-row input:first-child{flex:1}
.add-row input.amt{width:86px;flex:none;text-align:right}
.empty{padding:18px;color:var(--muted);font-size:14px;text-align:center}
.sumbox{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.sum-n{font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.sum-n.neg{color:var(--coral)}
.ta-r{text-align:right}

/* allocation */
.bar{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden}
.bar span{flex-grow:0;flex-shrink:1;height:100%;border-radius:3px;transition:flex-basis .3s var(--ease)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.leg{padding:11px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:1px;min-width:0}
.leg-top{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.leg strong{font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.leg .sm{color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.c-fixed{background:var(--cyan)}.c-debt{background:var(--coral)}.c-save{background:var(--amber)}.c-free{background:var(--green)}

.slider{padding:14px 16px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.slider-top{display:flex;align-items:center;gap:8px;font-weight:600}
.slider-top output{margin-left:auto;font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;margin:0;--p:50%}
input[type=range]:focus-visible{outline-offset:4px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--trk) var(--p),var(--raise) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--text);margin-top:-9px;box-shadow:0 0 0 5px var(--trk-glow),0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--raise)}
input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--trk)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:var(--text);box-shadow:0 0 0 5px var(--trk-glow)}
.sl-debt{--trk:var(--coral);--trk-glow:rgba(255,122,107,.22)}
.sl-save{--trk:var(--amber);--trk-glow:rgba(240,189,79,.22)}

.status{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14px}
.status .ic{width:18px;height:18px;margin-top:1px}
.status.ok{background:rgba(140,198,63,.08);color:var(--green-hi);box-shadow:inset 0 0 0 1px rgba(140,198,63,.25)}
.status.bad{background:rgba(255,122,107,.08);color:#ffb3a9;box-shadow:inset 0 0 0 1px rgba(255,122,107,.3)}
.status.info{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.status .btn{margin-top:8px}
.status-col{display:flex;flex-direction:column;gap:2px;flex:1}

/* debts */
.dcards{display:flex;flex-direction:column;gap:10px}
.dcard{appearance:none;border:0;text-align:left;width:100%;background:var(--surface);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:box-shadow .2s,background-color .2s}
.dcard:hover{box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface-2)}
.dc-top{display:flex;align-items:center;gap:12px}
.dc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dc-name{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-meta{font-size:12.5px;color:var(--muted);display:block}
.dc-amt{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dcard .row-ic{color:var(--coral);background:rgba(255,122,107,.1)}
.dcard.paid .row-ic{color:var(--green);background:rgba(140,198,63,.12)}
.prog{display:block;height:6px;border-radius:99px;background:var(--raise);overflow:hidden}
.prog>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--green-hi));transition:width .5s var(--ease)}
.dc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.warn{color:var(--coral);background:rgba(255,122,107,.1)}
.tag.ok{color:var(--green-hi);background:rgba(140,198,63,.12)}
.tag.plain{color:var(--muted);background:var(--raise)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{padding:11px 12px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.trio b{display:block;font-family:var(--display);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* app header + hero */
.app-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:2px}
.hello{display:flex;align-items:center;gap:11px;min-width:0}
.hello-name{font-weight:700;font-size:16px}
.mark{display:block}
.mark .mk-fill{fill:currentColor}
.mark .mk-cut{fill:none;stroke:var(--bg)}
.mark .mk-hole{fill:var(--bg)}
.mark-sm{width:34px;height:34px;color:var(--green)}

.hero{position:relative;display:flex;align-items:center;gap:18px;padding:18px;border-radius:24px;background:linear-gradient(160deg,#142118,#0b110d 62%);box-shadow:inset 0 0 0 1px #25362a;overflow:hidden}
.hero::after{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(182,234,110,.75),transparent)}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--raise)}
.view.enter .ring .val{animation:ringIn 1.1s var(--ease) .15s both}
@keyframes ringIn{from{stroke-dashoffset:var(--circ)}}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.ring-c span{font-size:11.5px;color:var(--muted)}
.hero-r{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-k{font-size:13px;color:var(--muted)}
.hero-n{display:flex;align-items:baseline;gap:6px}
.hero-n b{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-n span{font-family:var(--display);font-size:15px;color:var(--muted)}
.hero-d{font-size:13px;color:var(--green-hi)}

.next{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.next-main{flex:1;min-width:0}
.next-t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daybox{width:46px;height:48px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--raise);flex:none;color:var(--text)}
.daybox b{font-family:var(--display);font-size:17px;line-height:1.05;font-weight:600}
.daybox small{font-size:10.5px;color:var(--muted)}
.daybox.debt{background:rgba(255,122,107,.12);color:var(--coral)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.promo{appearance:none;border:0;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;cursor:pointer;background:linear-gradient(120deg,rgba(140,198,63,.14),rgba(92,207,230,.08));box-shadow:inset 0 0 0 1px rgba(140,198,63,.35)}
.promo .row-ic{background:rgba(140,198,63,.16);color:var(--green-hi)}
.promo-main{flex:1;min-width:0;display:flex;flex-direction:column}
.promo b{font-weight:700}
.chev{color:var(--faint)}

/* pay */
.rem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.rem-t{font-weight:700}
.switch{appearance:none;border:0;width:50px;height:30px;border-radius:99px;background:var(--raise);position:relative;cursor:pointer;flex:none;box-shadow:inset 0 0 0 1px var(--line-2);transition:background-color .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .22s var(--ease),background-color .2s}
.switch.on{background:rgba(140,198,63,.3)}
.switch.on::after{transform:translateX(20px);background:var(--green-hi)}
.prow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:1px solid var(--line);transition:opacity .2s}
.prow-main{flex:1;min-width:0}
.prow-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.done{opacity:.6}
.prow.done .prow-name{text-decoration:line-through;text-decoration-color:var(--faint)}

      var b = backTarget();
      if (!b) return;
      if (ui.edit && (ui.screen === "salary" || ui.screen === "expenses" || ui.screen === "split")) ui.edit = null;
      go(b);
    },
    toggleTerms: function (d, el) {
      ui.terms = !ui.terms;
      el.classList.toggle("on", ui.terms);
      el.setAttribute("aria-checked", String(ui.terms));
      if (ui.terms) clearErr();
    },
    accept: function () {
      var name = val("st-name").replace(/\s+/g, " ").trim().slice(0, 40);
      if (!ui.terms) {
        var c = document.querySelector(".check");
        if (c) { c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash"); }
        return err("Marca la casilla para continuar.");
      }
      st.name = name;
      st.accepted = { at: new Date().toISOString(), v: TERMS_V };
      save();
      if (st.stage === "app") go("home", { msg: "Abriendo tu plan" });
      else go("salary");
    },
    freq: function (d) { st.freq = d.val; save(); rerender(); },
    next: function () {
      var s = ui.screen, v = calc();
      if (s === "salary") {
        if (!(st.salary >= 100)) return err("Escribe tu sueldo neto, como mínimo 100 €.");
        if (ui.edit) return leaveEdit("Sueldo actualizado");
        go("expenses");
      } else if (s === "expenses") {
        if (v.fixed >= v.inc) return err("Tus gastos fijos (" + eur(v.fixed) + ") superan tu sueldo (" + eur(v.inc) + "). Revisa los importes.");
        if (ui.edit) return leaveEdit("Gastos actualizados");
        go("obDebts");
      } else if (s === "obDebts") {
        var hasDebt = st.debts.some(function (x) { return x.balance > 0; });
        if (!hasDebt) st.debtPct = 0;
        else if (!v.covers) st.debtPct = recommend().debt;
        save();
        go("split");
      } else if (s === "split") {
        if (!v.valid) return err("Corrige el reparto antes de guardar.");
        if (ui.edit) return leaveEdit("Plan guardado");
        go("result", { long: true });
      }
    },
    expDel: function (d) {
      var e = st.expenses.filter(function (x) { return x.id === d.id; })[0];
      st.expenses = st.expenses.filter(function (x) { return x.id !== d.id; });
      Object.keys(st.paid).forEach(function (k) { if (k === "e:" + d.id) delete st.paid[k]; });
      save(); rerender();
      toast("Quitado: " + (e && e.name ? e.name : "gasto"));
    },
    expAdd: function () {
      var name = val("ex-name").trim(), amt = parseNum(val("ex-amt"));
      if (!name) return err("Ponle un nombre al gasto.");
      if (!(amt > 0)) return err("Escribe cuánto pagas al mes por " + name + ".");
      st.expenses.push({ id: uid("e"), icon: "tag", name: name, amount: amt, day: null });
      save(); rerender();
      toast("Añadido: " + name);
    },
    debtAdd: function () {
      if (!isPremium() && st.debts.length >= 1) return openSheet("gate", { what: "debt" });
      openDebtForm(null);
    },
    debtEdit: function (d) {
      var x = st.debts.filter(function (q) { return q.id === d.id; })[0];
      if (x) openDebtForm(x);
    },
    dfType: function (d) {
      ui.form.type = d.val;
      document.querySelectorAll('.chip[data-act="dfType"]').forEach(function (c) {
        var on = c.dataset.val === d.val;
        c.classList.toggle("on", on);
        c.setAttribute("aria-checked", String(on));
      });
      var n = document.getElementById("df-name");
      var labels = Object.keys(DT).map(function (k) { return DT[k].label; });
      if (n && (!n.value.trim() || labels.indexOf(n.value.trim()) > -1)) n.value = DT[d.val].label;
      refreshLive();
    },
    debtSave: function () {
      var type = ui.form.type || "card";
      var name = val("df-name").trim() || DT[type].label;
      var bal = parseNum(val("df-bal")), apr = parseNum(val("df-apr")), min = parseNum(val("df-min")), day = Math.round(parseNum(val("df-day")));
      if (!(bal > 0)) return err("Escribe cuánto debes.");
      if (!(apr >= 0 && apr <= 100)) return err("El interés tiene que estar entre 0 y 100 %.");
      if (!(min > 0)) return err("Escribe la cuota mínima que pagas cada mes.");
      if (!(day >= 1 && day <= 31)) return err("El día de pago va del 1 al 31.");
      var editing = !!ui.form.id;
      if (editing) {
        var x = st.debts.filter(function (q) { return q.id === ui.form.id; })[0];
        if (x) {
          x.type = type; x.name = name; x.apr = apr; x.min = min; x.day = day;
          x.original = st.stage === "app" ? Math.max(x.original || bal, bal) : bal;
          x.balance = bal;
        }
      } else {
        st.debts.push({ id: uid("d"), type: type, name: name, balance: bal, original: bal, apr: apr, min: min, day: day });
      }
      var msg = editing ? "Deuda actualizada" : "Deuda añadida";
      if (st.stage === "app") {
        var v = calc();
        if (!v.covers && v.minPct <= 80) { st.debtPct = v.minPct; msg += ". Deuda subida al " + v.minPct + " % para cubrir las cuotas"; }
      }
      save(); closeSheet(); rerender(); toast(msg);
    },
    debtDel: function (d, el) {
      if (ui.confirmDel !== d.id) { ui.confirmDel = d.id; el.textContent = "Pulsa otra vez para eliminar"; return; }
      st.debts = st.debts.filter(function (q) { return q.id !== d.id; });
      delete st.paid["d:" + d.id];
      save(); closeSheet(); rerender(); toast("Deuda eliminada");
    },
    recommend: function () {
      var r = recommend();
      st.debtPct = r.debt; st.savePct = r.save; save(); rerender();
      toast("Reparto recomendado aplicado");
    },
    calc: function () { ACT.next(); },
    adjust: function () { go("split"); },
    finish: function () {
      st.stage = "app"; st.month = 0; st.paid = {}; st.paidTotal = 0; st.savedTotal = 0;
      st.debts.forEach(function (d) { d.original = d.balance; });
      save();
      /* Ask the browser to keep this site's storage (best effort; ignored where unsupported). */
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* ignore */ }
      go("home", { msg: "Preparando tu panel", after: function () { toast("Plan activado"); } });
    },
    tab: function (d) { if (d.val !== ui.screen) go(d.val); },
    goPay: function () { go("pay"); },
    payToggle: function (d) {
      if (st.paid[d.id]) delete st.paid[d.id]; else st.paid[d.id] = true;
      var on = !!st.paid[d.id];
      save(); rerender();
      if (on) toast("Marcado como hecho");
    },
    closeMonth: function () {
      var v = calc();
      if (!v.valid) return toast(v.over ? "Tu reparto supera tu sueldo. Ajusta el plan." : "Tu reparto no cubre las cuotas mínimas.", "warn");
      var al = monthAllocation(v.debtA), paidSum = 0, name = monthLabel(0);
      st.debts.forEach(function (d) {
        if (d.balance <= 0) return;
        d.balance = d.balance * (1 + d.apr / 1200);
        var p = Math.min(al.map[d.id] || 0, d.balance);
        d.balance -= p; paidSum += p;
        if (d.balance < 0.5) d.balance = 0;
      });
      var pot = v.saveA + (v.active.length ? al.leftover : 0), savedNow = pot;
      st.goals.forEach(function (g) {
        if (pot <= 0) return;
        var need = g.target - g.saved;
        if (need <= 0) return;
        var a = Math.min(need, pot); g.saved += a; pot -= a;
      });
      st.month += 1; st.paid = {}; st.paidTotal += paidSum; st.savedTotal += savedNow;
      save();
      var allPaid = st.debts.length && st.debts.every(function (d) { return d.balance <= 0; });
      go("home", {
        msg: "Cerrando " + name.split(" de ")[0],
        after: function () { toast(allPaid ? "¡Has terminado de pagar tus deudas!" : "Mes cerrado: " + eur(paidSum) + " a deudas y " + eur(savedNow) + " a metas"); }
      });
    },
    editPlan: function () { ui.edit = ui.screen; go("split"); },
    editSalary: function () { ui.edit = ui.screen; go("salary"); },
    editExpenses: function () { ui.edit = ui.screen; go("expenses"); },
    toPremium: function () { ui.prev = ui.screen; go("premium"); },
    legal: function (d) { openSheet("legal", { doc: d.val }); },
    editName: function () { openSheet("name"); },
    nameSave: function () {
      st.name = val("nm-name").replace(/\s+/g, " ").trim().slice(0, 40);
      save(); closeSheet(); rerender();
      toast(st.name ? "Nombre guardado" : "Nombre quitado");
    },
    install: function () {
      if (installEvt) {
        var e = installEvt;
        installEvt = null;
        try {
          e.prompt();
          e.userChoice.then(function (c) {
            if (c && c.outcome === "accepted") { st.installHidden = true; save(); }
            if (!ui.busy && !ui.sheet && ui.screen) rerender();
          }, function () {});
        } catch (ex) { openSheet("install"); }
        return;
      }
      openSheet("install");
    },
    installHide: function () { st.installHidden = true; save(); rerender(); toast("Puedes instalarla cuando quieras desde Ajustes"); },
    exportFile: function () {
      var text = exportPayload(), name = "debtout-copia-" + isoDay() + ".json";
      var done = function () { st.lastExport = new Date().toISOString(); save(); };
      var download = function () {
        try {
          var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
          var a = document.createElement("a");
          a.href = url; a.download = name; a.rel = "noopener"; a.style.display = "none";
          document.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
          done(); toast("Copia descargada");
        } catch (ex) { toast("No se pudo descargar. Copia el texto.", "warn"); }
      };
      /* On phones the share sheet lets people save the file to Files, Drive or send it to themselves. */
      var touch = false;
      try { touch = window.matchMedia("(pointer: coarse)").matches; } catch (ex) { /* ignore */ }
      try {
        var file = typeof File === "function" ? new File([text], name, { type: "application/json" }) : null;
        if (touch && file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          navigator.share({ files: [file], title: "Copia de DebtOut" }).then(function () { done(); toast("Copia guardada"); }, function (ex) {
            if (!ex || ex.name !== "AbortError") download();
          });
          return;
        }
      } catch (ex) { /* fall back to a download */ }
      download();
    },
    importOpen: function () { openSheet("import"); },
    importDo: function () { importText(val("imp-json")); },
    feedback: function () {
      var e = contactEmail();
      if (!e) return;
      window.location.href = "mailto:" + e + "?subject=" + encodeURIComponent("DebtOut beta: comentarios") + "&body=" + encodeURIComponent("\n\n(DebtOut " + VERSION + ")");
    },
    goalAdd: function () {
      if (!isPremium() && st.goals.length >= 1) return openSheet("gate", { what: "goal" });
      openGoalForm(null);
    },
    goalEdit: function (d) {
      var g = st.goals.filter(function (x) { return x.id === d.id; })[0];
      if (g) openGoalForm(g);
    },
    goalPreset: function (d) {
      var n = document.getElementById("gf-name");
      if (n) n.value = d.val;
      document.querySelectorAll('.chip[data-act="goalPreset"]').forEach(function (c) { c.classList.toggle("on", c.dataset.val === d.val); });
    },
    goalSave: function () {
      var name = val("gf-name").trim(), target = parseNum(val("gf-target")), saved = parseNum(val("gf-saved"));
      if (!name) return err("Ponle nombre a tu meta.");
      if (!(target > 0)) return err("Escribe cuánto quieres juntar.");
      if (!(saved >= 0)) saved = 0;
      var editing = !!ui.form.id;
      if (editing) {
        var g = st.goals.filter(function (x) { return x.id === ui.form.id; })[0];
        if (g) { g.name = name; g.target = target; g.saved = saved; }
      } else {
        st.goals.push({ id: uid("g"), name: name, target: target, saved: saved });
      }
      save(); closeSheet(); rerender(); toast(editing ? "Meta actualizada" : "Meta creada");
    },
    goalDel: function (d, el) {
      if (ui.confirmDel !== d.id) { ui.confirmDel = d.id; el.textContent = "Pulsa otra vez para eliminar"; return; }
      st.goals = st.goals.filter(function (g) { return g.id !== d.id; });
      save(); closeSheet(); rerender(); toast("Meta eliminada");
    },
    goalContrib: function (d) {
      var g = st.goals.filter(function (x) { return x.id === d.id; })[0];
      if (!g) return;
      var add = Math.min(50, Math.max(0, g.target - g.saved));
      if (add <= 0) return toast("Esta meta ya está completa");
      g.saved += add; save(); rerender();
      toast(g.saved >= g.target ? "¡Meta conseguida: " + g.name + "!" : "+" + eur(add) + " a " + g.name);
    },
    remToggle: function () {
      if (!isPremium() && !st.reminders) return openSheet("gate", { what: "rem" });
      st.reminders = !st.reminders; st.remindDay = ""; save(); rerender();
      toast(st.reminders ? "Avisos de pago activados" : "Avisos de pago desactivados");
    },
    bell: function () { openSheet("notif"); },
    exportData: function () { openSheet("export"); },
    copyExport: function () {
      var t = document.getElementById("exp-json");
      copyText(t ? t.value : "", t, "Datos copiados");
      st.lastExport = new Date().toISOString(); save();
    },
    deleteAsk: function () { openSheet("del"); },
    deleteYes: function () {
      clearTimeout(saveTimer);
      try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      st = defaults(); ui.terms = false; ui.edit = null;
      closeSheet(true);
      go("welcome", { msg: "Borrando tus datos", after: function () { toast("Datos borrados de este dispositivo"); } });
    },
    closeSheet: function () { closeSheet(); },
    gateYes: function () {
      closeSheet(true);
      ui.prev = ui.screen;
      go("premium");
    }
  };

  function copyText(text, fallbackEl, okMsg) {
    var fail = function () {
      if (fallbackEl) { try { fallbackEl.focus(); fallbackEl.select(); } catch (e) { /* ignore */ } }
      toast("Texto seleccionado: cópialo con Ctrl+C o mantén pulsado", "warn");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast(okMsg || "Copiado"); }, fail);
      } else fail();
    } catch (e) { fail(); }
  }

  function importText(text) {
    text = String(text || "").trim();
    if (!text) return err("Elige un archivo o pega el texto de tu copia.");
    if (text.length > 2000000) return err("Ese archivo es demasiado grande para ser una copia de DebtOut.");
    var j = null;
    try { j = JSON.parse(text); } catch (e) { return err("No parece una copia de DebtOut. Revisa que hayas pegado el texto completo."); }
    var o = j && typeof j === "object" && j.plan ? j.plan : j;
    var plan = o && o.v === 3 ? normalize(o) : null;
    if (!plan) return err("No parece una copia de DebtOut. Revisa que hayas pegado el texto completo.");
    clearTimeout(saveTimer);
    st = plan; ui.edit = null; ui.terms = !!st.accepted;
    save(); closeSheet(true);
    var next = !st.accepted ? "start" : st.stage === "app" ? "home" : "salary";
    go(next, { msg: "Restaurando tu copia", after: function () { toast(next === "start" ? "Copia cargada. Acepta los términos para seguir" : "Copia restaurada"); } });
  }

  var INPUT = {
    salary: function (t) { var n = parseNum(t.value); st.salary = isFinite(n) && n > 0 ? n : 0; save(); refreshLive(); },
    expAmt: function (t) {
      var e = st.expenses.filter(function (x) { return x.id === t.dataset.id; })[0];
      if (!e) return;
      var n = parseNum(t.value); e.amount = isFinite(n) && n >= 0 ? n : 0; save(); refreshLive();
    },
    expName: function (t) {
      var e = st.expenses.filter(function (x) { return x.id === t.dataset.id; })[0];
      if (e) { e.name = t.value; save(); }
    },
    debtPct: function (t) { st.debtPct = Number(t.value) || 0; t.style.setProperty("--p", (st.debtPct / 80 * 100) + "%"); save(); refreshLive(); },
    savePct: function (t) { st.savePct = Number(t.value) || 0; t.style.setProperty("--p", (st.savePct / 60 * 100) + "%"); save(); refreshLive(); },
    debtForm: function () { refreshLive(); }
  };

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || t.disabled || ui.busy) return;
    var fn = ACT[t.dataset.act];
    if (!fn) return;
    e.preventDefault();
    try { fn(t.dataset, t); } catch (ex) { console.error(ex); toast("Algo ha fallado. Vuelve a intentarlo.", "warn"); }
  });
  document.addEventListener("input", function (e) {
    var t = e.target, k = t.dataset && t.dataset.input;
    if (k && INPUT[k]) { try { INPUT[k](t); } catch (ex) { console.error(ex); } }
    if (t.matches && t.matches("input") && !ui.busy) clearErr();
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (!t || t.id !== "imp-file" || !t.files || !t.files[0]) return;
    var f = t.files[0];
    if (f.size > 2000000) { err("Ese archivo es demasiado grande para ser una copia de DebtOut."); t.value = ""; return; }
    var r = new FileReader();
    r.onload = function () { importText(r.result); };
    r.onerror = function () { err("No se pudo leer el archivo. Prueba a pegar su texto."); };
    r.readAsText(f);
    t.value = "";
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && ui.sheet) { closeSheet(); return; }
    var t = e.target;
    if (e.key === "Enter" && t.dataset && t.dataset.enter && !ui.busy) {
      var fn = ACT[t.dataset.enter];
      if (fn) { e.preventDefault(); fn(t.dataset, t); }
    }
  });
  var touchX = null;
  $("#view").addEventListener("touchstart", function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  $("#view").addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (dx > 70 && touchX === null && backTarget() && !ui.busy && !ui.sheet && e.target.closest && !e.target.closest('input[type="range"]')) ACT.back();
  });

  function tick() {
    var d = new Date(), c = $("#clock");
    if (c) c.textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function init() {
    tick();
    setInterval(tick, 20000);
    var first = st.stage === "app" ? "home" : "welcome";
    $("#view").innerHTML = loaderHTML("Iniciando DebtOut");
    setTimeout(function () { go(first, { skipLoader: true, after: first === "home" ? remindOnOpen : null }); }, reduced() ? 40 : 800);
  }

  /* ---------- installable app ---------- */
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    installEvt = e;
    if (!ui.busy && !ui.sheet && (ui.screen === "home" || ui.screen === "settings")) rerender();
  });
  window.addEventListener("appinstalled", function () {
    installEvt = null;
    st.installHidden = true; save();
    if (!ui.busy && !ui.sheet && (ui.screen === "home" || ui.screen === "settings")) rerender();
    toast("DebtOut instalada");
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || ui.busy || ui.sheet || ui.screen !== "home") return;
    rerender();
    remindOnOpen();
  });
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* the app works without it */ });
    });
  }

  window.__debtout = { st: function () { return st; }, ui: ui, calc: calc, simulate: simulate, minOnly: minOnly };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
